apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanwuya-dev-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanwuya-nginx
  template:
    metadata:
      labels:
        app: sanwuya-nginx
    spec:
      containers:
        - name: nginx
          image: cithit/sanwuya:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: sanwuya-dev-service
spec:
  selector:
    app: sanwuya-nginx
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32000